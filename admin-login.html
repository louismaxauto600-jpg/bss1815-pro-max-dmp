<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    setPersistence,
    browserLocalPersistence,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB24Sbq_ud2qSFtdHwRhiKelokeIjCtDuY",
    authDomain: "briyant-soley-signo-1815.firebaseapp.com",
    projectId: "briyant-soley-signo-1815",
    storageBucket: "briyant-soley-signo-1815.firebasestorage.app",
    messagingSenderId: "873317957685",
    appId: "1:873317957685:web:1bb4bb30831a058399717c",
    measurementId: "G-QLDJNN876H"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const MAX_LOUIS_EMAIL =
    "briyantsoleysigno1815@gmail.com";

  const MAX_LOUIS_UID =
    "I7n4gtwXAtMVe3YOjEMm1h7DJ3B3";

  const loginForm =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const resetButton =
    document.getElementById("resetButton");

  const showPassword =
    document.getElementById("showPassword");

  const message =
    document.getElementById("message");

  function displayMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "";
  }

  function getErrorMessage(code) {
    const errors = {
      "auth/invalid-credential":
        "Imel oswa modpas la pa kòrèk.",

      "auth/invalid-login-credentials":
        "Imel oswa modpas la pa kòrèk.",

      "auth/wrong-password":
        "Modpas la pa kòrèk.",

      "auth/user-not-found":
        "Firebase pa jwenn kont sa a.",

      "auth/invalid-email":
        "Adrès imel la pa valab.",

      "auth/user-disabled":
        "Kont sa a dezaktive nan Firebase.",

      "auth/too-many-requests":
        "Twòp tantativ fèt. Tann yon ti moman.",

      "auth/network-request-failed":
        "Verifye koneksyon entènèt la.",

      "auth/missing-password":
        "Antre modpas la."
    };

    return errors[code] ||
      "Login lan pa reyisi. Eseye ankò.";
  }

  showPassword.addEventListener(
    "click",
    () => {
      const hidden =
        passwordInput.type === "password";

      passwordInput.type =
        hidden ? "text" : "password";

      showPassword.textContent =
        hidden ? "🙈" : "👁";

      showPassword.setAttribute(
        "aria-label",
        hidden ? "Kache modpas" : "Montre modpas"
      );
    }
  );

  loginForm.addEventListener(
    "submit",
    async (event) => {
      event.preventDefault();
      clearMessage();

      const email =
        emailInput.value.trim().toLowerCase();

      const password =
        passwordInput.value;

      if (!email || !password) {
        displayMessage(
          "Antre imel ak modpas la.",
          "error"
        );
        return;
      }

      loginButton.disabled = true;
      resetButton.disabled = true;
      loginButton.textContent = "VERIFIKASYON...";

      try {
        await setPersistence(
          auth,
          browserLocalPersistence
        );

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        const firebaseUser = credential.user;

        const connectedEmail =
          firebaseUser.email
            ?.trim()
            .toLowerCase() || "";

        const connectedUid =
          firebaseUser.uid;

        const isMaxLouis =
          connectedEmail === MAX_LOUIS_EMAIL &&
          connectedUid === MAX_LOUIS_UID;

        if (connectedEmail === MAX_LOUIS_EMAIL &&
            connectedUid !== MAX_LOUIS_UID) {
          await signOut(auth);

          displayMessage(
            "UID kont Max Louis la pa koresponn ak UID Super Admin otorize a.",
            "error"
          );
          return;
        }

        if (connectedUid === MAX_LOUIS_UID &&
            connectedEmail !== MAX_LOUIS_EMAIL) {
          await signOut(auth);

          displayMessage(
            "Imel kont Super Admin lan pa koresponn.",
            "error"
          );
          return;
        }

        const role =
          isMaxLouis ? "SUPER_ADMIN" : "ADMIN";

        sessionStorage.setItem(
          "bss1815Role",
          role
        );

        sessionStorage.setItem(
          "bss1815Email",
          connectedEmail
        );

        sessionStorage.setItem(
          "bss1815Uid",
          connectedUid
        );

        sessionStorage.setItem(
          "bss1815Authenticated",
          "true"
        );

        localStorage.setItem(
          "bss1815Role",
          role
        );

        localStorage.setItem(
          "bss1815Email",
          connectedEmail
        );

        localStorage.setItem(
          "bss1815Uid",
          connectedUid
        );

        localStorage.setItem(
          "bss1815Authenticated",
          "true"
        );

        if (isMaxLouis) {
          displayMessage(
            "Super Admin Max Louis verifye. N ap ouvri Admin Dashboard la...",
            "success"
          );
        } else {
          displayMessage(
            "Admin verifye. N ap ouvri Admin Dashboard la...",
            "success"
          );
        }

        setTimeout(() => {
          window.location.replace(
            "./admin-dashboard.html"
          );
        }, 700);

      } catch (error) {
        console.error(
          "BSS1815 LOGIN ERROR:",
          error
        );

        displayMessage(
          getErrorMessage(error.code),
          "error"
        );
      } finally {
        loginButton.disabled = false;
        resetButton.disabled = false;

        loginButton.textContent =
          "ANTRE NAN ADMIN DASHBOARD";
      }
    }
  );

  resetButton.addEventListener(
    "click",
    async () => {
      clearMessage();

      const email =
        emailInput.value.trim().toLowerCase();

      if (!email) {
        displayMessage(
          "Antre imel la anvan.",
          "error"
        );

        emailInput.focus();
        return;
      }

      resetButton.disabled = true;
      loginButton.disabled = true;
      resetButton.textContent = "AP VOYE...";

      try {
        await sendPasswordResetEmail(
          auth,
          email
        );

        displayMessage(
          "Firebase voye yon nouvo lyen reset modpas nan imel la. Itilize sèlman dènye lyen an.",
          "success"
        );
      } catch (error) {
        displayMessage(
          getErrorMessage(error.code),
          "error"
        );
      } finally {
        resetButton.disabled = false;
        loginButton.disabled = false;

        resetButton.textContent =
          "RESET PASSWORD";
      }
    }
  );
</script>
