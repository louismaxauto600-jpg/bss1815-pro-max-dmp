<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#080604">

  <title>BSS1815 | Admin Dashboard</title>

  <!--
    BSS1815 PRO-MAX DMP
    ADMIN DASHBOARD ENTRY
    ROOT FILE: /admin-dashboard.html

    Dashboard reyèl:
    /pages/admin-dashboard/dashboard.html
  -->

  <meta
    http-equiv="refresh"
    content="0; url=./pages/admin-dashboard/dashboard.html"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(
          circle at top,
          rgba(255, 145, 0, 0.22),
          transparent 38%
        ),
        linear-gradient(
          145deg,
          #000000 0%,
          #080604 45%,
          #1b0b00 75%,
          #000000 100%
        );
      color: #ffffff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .loader {
      width: min(520px, 100%);
      padding: 38px 28px;
      border: 1px solid rgba(255, 145, 0, 0.45);
      border-radius: 24px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 122, 0, 0.12),
          rgba(0, 0, 0, 0.92)
        );
      box-shadow:
        0 0 35px rgba(255, 122, 0, 0.18);
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 20px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ff8500;
      box-shadow:
        0 0 22px rgba(255, 133, 0, 0.5);
    }

    h1 {
      color: #ff9b21;
      font-size: clamp(25px, 6vw, 38px);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    h2 {
      color: #ffb35c;
      font-size: 17px;
      margin-bottom: 24px;
      font-weight: 600;
    }

    p {
      color: #f2d7bd;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      margin: 18px auto 25px;
      border-radius: 50%;
      border: 4px solid rgba(255, 153, 32, 0.2);
      border-top-color: #ff9418;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 24px;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          #ff7300,
          #ffad4d
        );
      color: #000000;
      font-weight: 900;
      text-decoration: none;
      border: 1px solid #ffb45c;
      box-shadow:
        0 8px 25px rgba(255, 115, 0, 0.25);
    }

    .button:hover,
    .button:focus {
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 26px;
      color: #b98d68;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="loader">

    <img
      src="./bss-login-admin.webp"
      alt="BSS1815 Admin"
      class="logo"
      onerror="this.style.display='none'"
    >

    <h1>BSS1815</h1>

    <h2>ADMIN DASHBOARD</h2>

    <div
      class="spinner"
      aria-hidden="true"
    ></div>

    <p>
      Ouvè Admin Dashboard la...
    </p>

    <a
      class="button"
      href="./pages/admin-dashboard/dashboard.html"
    >
      OUVRI ADMIN DASHBOARD
    </a>

    <div class="footer">
      BSS1815 PRO-MAX DMP
    </div>

  </main>

  <script>
    /*
      Fallback JavaScript redirect.
      Sa garanti redireksyon an menm si
      meta refresh la pa egzekite.
    */

    const dashboardURL =
      "./pages/admin-dashboard/dashboard.html";

    window.setTimeout(() => {
      window.location.replace(dashboardURL);
    }, 250);
  </script>

</body>
</html>
