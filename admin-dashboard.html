<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img src="logo.jpg" alt="BSS 1815" class="brand-logo" onerror="this.style.display='none'">
    <div class="brand-eyebrow">BRIYANT SOLEY SIGNO · BSS 1815</div>
    <h1>Admin Dashboard</h1>
    <p class="sub">Konekte pou jere pwojè yo</p>

    <form id="loginForm">
      <label for="email">Imèl</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Modpas</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="btn-primary" id="loginBtn">Konekte</button>
    </form>

    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
