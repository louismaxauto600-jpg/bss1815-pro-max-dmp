<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSS1815 PRO-MAX DMP — Galeri</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  .galeri {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 2;
  }
  .slide img, .slide video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .controls {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 10;
  }
  .controls button {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: 22px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  .controls button:hover { background: rgba(255,255,255,0.25); }
  .counter {
    position: absolute;
    top: 18px;
    right: 20px;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    padding: 6px 12px;
    border-radius: 20px;
  }
  .logo {
    position: absolute;
    top: 18px;
    left: 20px;
    color: #fff;
    font-weight: bold;
    letter-spacing: 1px;
    font-size: 15px;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    padding: 6px 12px;
    border-radius: 20px;
  }
  .pause-btn {
    font-size: 16px !important;
  }
</style>
</head>
<body>

<div class="galeri" id="galeri">
  <div class="logo">BSS1815 PRO-MAX DMP</div>
  <div class="counter" id="counter">1 / 1</div>
  <div class="controls">
    <button id="prevBtn" aria-label="Précédent">&#10094;</button>
    <button id="playPauseBtn" class="pause-btn" aria-label="Pause">&#10073;&#10073;</button>
    <button id="nextBtn" aria-label="Suivant">&#10095;</button>
  </div>
</div>

<script>
// Non yo mete la a sipoze anndan MENM dosye ak fichye HTML sa a (chemen relatif).
// Si w mete yo nan yon sou-dosye (egzanp "galeri/"), ajoute non dosye a devan chak non fichye anba a.
const fichye = [
  "lebaron.jpg","michel-on-the-move.jpg","brunel.jpg","madina.jpg","stratège.jpg",
  "landry.jpg","sonson-felix.jpg","valery.jpg","maa.jpg","miami-an-aksyon2.jpg",
  "tania-felix.jpg","taniafelix.jpg","le-baron.jpg","max-louis-la-seul-edifference.jpg",
  "bss1815pro-maxdmp.jpg","men-in-black.jpg","change-is-comming.jpg","maximax-in-casual.jpg",
  "bss1815pro-max-media.jpg","san-presyon.jpg","miami-an-aksyon.jpg","the-man-in-green.jpg",
  "vice-president-ernso.jpg","president-arly.jpg","jeff-colin.jpg","sindy-andrevil.jpg",
  "the-man-in-maroon.jpg","max-louis-game-changer.jpg","stratège-l'noubliable.jpg",
  "bss.jpg","max.jpg","alèt.jpg","andy.jpg","dèdè.jpg","maxl.jpg","ralph.jpg","cols.jpg",
  "maxl2.jpg","nadou.jpg","tifrè.jpg","doodly.jpg","jq-max.jpg","kendy2.jpg","michel.jpg",
  "nadou2.jpg","ones-g.jpg","roro-8.jpg","rorony.jpg","sonsonn.jpg","tania2.jpg","ti-frè.jpg",
  "ti-rat.jpg","yguens.jpg","badin-s.jpg","bouboul.jpg","bss1815.jpg","cange-d.jpg",
  "marassa.jpg","paulema.jpg","sindy-b.jpg","pèrodin.jpg","maximax_multi_services.jpeg",
  "montina.mp4","promaxacademie.mp4","promax-academie.mp4","roro-laja.mp4","l'orateur.mp4",
  "la-presentation.mp4","la-confusion.mp4","maximax-multi-services.mp4","devan-devan-nèt.mp4",
  "confusion-totale.mp4","ersulie-danthor.mp4","one-man-show.mp4","why-me.mp4","why-not-max.mp4",
  "la-force-du-son.mp4","bss1815pro-max-dmp2.mp4","la-seule-difference.mp4","maximax.mp4",
  "the-done.mp4","pro-max-fm.mp4","instructor.mp4","l'orateur2.mp4","the-vision.mp4",
  "yeah-he-is.mp4","ti-marasa-yo.mp4","formé-jodi-a.mp4","max-is-the-man.mp4",
  "pro-max-dmpII.mp4","montina-le-prof.mp4","max-alias-baron.mp4","bati-pou-jodi-a.mp4",
  "laforce-du-son.mp4","pro-max-academie.mp4","pro-max-beat-lab.mp4","insurance-school.mp4",
  "Majistra-mauclair.mp4","bss1815pro-maxdmp.mp4"
];

const galeri = document.getElementById('galeri');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playPauseBtn = document.getElementById('playPauseBtn');

let current = 0;
let isPlaying = true;
let imageTimer = null;
const IMAGE_DURATION = 4500; // 4.5 segond pou chak foto

// Kreye tout slide yo davans (yo kache jiskaske yo vin aktif)
const slides = fichye.map((nom, i) => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.dataset.index = i;

  const ext = nom.split('.').pop().toLowerCase();
  if (ext === 'mp4' || ext === 'mov' || ext === 'webm') {
    const video = document.createElement('video');
    video.src = nom;
    video.muted = false;
    video.playsInline = true;
    video.preload = 'auto';
    div.appendChild(video);
  } else {
    const img = document.createElement('img');
    img.src = nom;
    img.loading = 'lazy';
    div.appendChild(img);
  }
  galeri.insertBefore(div, galeri.querySelector('.controls'));
  return div;
});

counter.textContent = `1 / ${slides.length}`;

function clearTimers() {
  if (imageTimer) { clearTimeout(imageTimer); imageTimer = null; }
}

function stopAllVideos() {
  slides.forEach(s => {
    const v = s.querySelector('video');
    if (v) { v.pause(); v.currentTime = 0; v.onended = null; }
  });
}

function showSlide(index) {
  clearTimers();
  stopAllVideos();

  slides.forEach(s => s.classList.remove('active'));
  current = (index + slides.length) % slides.length;
  const slide = slides[current];
  slide.classList.add('active');
  counter.textContent = `${current + 1} / ${slides.length}`;

  const video = slide.querySelector('video');

  if (video) {
    video.currentTime = 0;
    if (isPlaying) {
      video.play().catch(() => {});
      video.onended = () => { if (isPlaying) next(); };
    }
  } else if (isPlaying) {
    imageTimer = setTimeout(() => next(), IMAGE_DURATION);
  }
}

function next() { showSlide(current + 1); }
function prev() { showSlide(current - 1); }

function togglePlay() {
  isPlaying = !isPlaying;
  playPauseBtn.innerHTML = isPlaying ? '&#10073;&#10073;' : '&#9654;';
  const video = slides[current].querySelector('video');
  if (isPlaying) {
    if (video) {
      video.play().catch(() => {});
      video.onended = () => { if (isPlaying) next(); };
    } else {
      imageTimer = setTimeout(() => next(), IMAGE_DURATION);
    }
  } else {
    clearTimers();
    if (video) video.pause();
  }
}

nextBtn.addEventListener('click', () => { next(); });
prevBtn.addEventListener('click', () => { prev(); });
playPauseBtn.addEventListener('click', togglePlay);

// Kòmanse galri a
showSlide(0);
</script>

</body>
</html>
