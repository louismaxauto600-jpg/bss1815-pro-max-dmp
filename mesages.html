<!-- FILE: messages.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Center | MY MAXIMAX</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="maximax.css">
</head>
<body>

<div id="app"><p class="boot">Ap chaje…</p></div>
<noscript><p class="boot">JavaScript dwe aktive pou paj sa a mache.</p></noscript>

<script type="module">
import { startModule } from "./maximax-core.js";

startModule({
  "title": "Message Center",
  "icon": "💬",
  "desc": "Mesaj entèn ak kominikasyon administrasyon.",
  "collection": "mx_messages",
  "fields": [
    {
      "key": "subject",
      "label": "Sijè",
      "required": true
    },
    {
      "key": "recipient",
      "label": "Destinatè"
    },
    {
      "key": "body",
      "label": "Mesaj",
      "type": "textarea",
      "required": true
    },
    {
      "key": "priority",
      "label": "Priyorite",
      "type": "select",
      "options": [
        "Nòmal",
        "Ijan"
      ]
    },
    {
      "key": "status",
      "label": "Estati",
      "type": "select",
      "options": [
        "Bouyon",
        "Voye",
        "Li"
      ]
    }
  ],
  "badge": "status",
  "note": "Mesaj yo sove nan Firebase. Livrezon otomatik (imèl, SMS) poko konfigire."
});
</script>

</body>
</html>
