<!-- FILE: members.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Center | MY MAXIMAX</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="maximax.css">
</head>
<body>

<div id="app"><p class="boot">Ap chaje…</p></div>
<noscript><p class="boot">JavaScript dwe aktive pou paj sa a mache.</p></noscript>

<script type="module">
import { startModule } from "./maximax-core.js";

startModule({
  "title": "Member Center",
  "icon": "👥",
  "desc": "Jesyon manm, pwofil, estati ak enfòmasyon kominote.",
  "collection": "mx_members",
  "fields": [
    {
      "key": "fullName",
      "label": "Non konplè",
      "required": true
    },
    {
      "key": "memberNumber",
      "label": "Nimewo manm"
    },
    {
      "key": "phone",
      "label": "Telefòn",
      "type": "tel"
    },
    {
      "key": "email",
      "label": "Imèl",
      "type": "email"
    },
    {
      "key": "city",
      "label": "Vil / Zòn"
    },
    {
      "key": "role",
      "label": "Wòl",
      "type": "select",
      "options": [
        "Manm",
        "Volontè",
        "Dirijan",
        "Mizisyen"
      ]
    },
    {
      "key": "status",
      "label": "Estati",
      "type": "select",
      "options": [
        "Aktif",
        "Inaktif",
        "Sispann"
      ]
    },
    {
      "key": "joinedAt",
      "label": "Dat adezyon",
      "type": "date"
    },
    {
      "key": "notes",
      "label": "Nòt",
      "type": "textarea"
    }
  ],
  "badge": "status"
});
</script>

</body>
</html>
