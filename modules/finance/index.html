<!-- FILE: modules/finance/index.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance / Treasury | BSS1815 PRO-MAX DMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#000,#ff6a00,#000);color:#fff;min-height:100vh}
header{text-align:center;padding:40px 20px;background:#000;border-bottom:3px solid #ff7a00}
header h1{font-size:45px;color:#ff7a00}
header p{color:#ffb366;margin-top:10px}
.back-btn{display:inline-block;margin-top:14px;color:#fff3e6;text-decoration:none;border:1px solid #ff7a00;padding:9px 14px;border-radius:30px;font-weight:bold}
.back-btn:hover{background:#ff7a00;color:#000}
main{width:min(1200px,95%);margin:30px auto}
.card{background:#111;border:2px solid #ff7a00;border-radius:15px;padding:20px;margin-bottom:25px}
.card h2{color:#ff7a00;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:bold;color:#ffb366}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ff7a00;background:#000;color:#fff}
button{margin-top:15px;padding:12px 20px;background:#ff7a00;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{background:#ff8c1a}
table{width:100%;border-collapse:collapse;margin-top:18px;background:#000;border-radius:12px;overflow:hidden}
th,td{border:1px solid #ff7a00;padding:10px;text-align:left}
th{background:#ff7a00;color:#000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{border:1px solid #ff7a00;border-radius:14px;padding:16px;background:#000;text-align:center}
.stat strong{display:block;font-size:26px}
.positive{color:#4CAF50}
.negative{color:#ff5252}
footer{text-align:center;padding:20px;margin-top:40px;border-top:3px solid #ff7a00;background:#000}
</style>
</head>
<body>

<header>
<h1>FINANCE / TREASURY</h1>
<p>BSS1815 PRO-MAX DMP</p>
<p><strong>DEVAN DEVAN NÈT. PARE POU DEMEN.</strong></p>
<a class="back-btn" href="../../index.html">← Retounen nan Platfòm nan</a>
</header>

<main>

<div class="card">
<h2>Rezime Trezò</h2>
<div class="stats">
<div class="stat"><strong style="color:#4CAF50" id="totalIncome">$0.00</strong>Total Antre</div>
<div class="stat"><strong style="color:#ff5252" id="totalExpense">$0.00</strong>Total Depans</div>
<div class="stat"><strong style="color:#ff7a00" id="balance">$0.00</strong>Balans</div>
</div>
</div>

<div class="card">
<h2>Ajoute Tranzaksyon</h2>
<div class="grid">
<div>
<label>Kalite</label>
<select id="txType">
<option value="income">Antre (Revni)</option>
<option value="expense">Depans</option>
</select>
</div>
<div>
<label>Montan (USD)</label>
<input id="txAmount" type="number" step="0.01" placeholder="0.00">
</div>
<div>
<label>Kategori</label>
<input id="txCategory" type="text" placeholder="Egzanp: Donasyon, Lwaye, Evènman...">
</div>
</div>
<label>Nòt</label>
<input id="txNotes" type="text" placeholder="Detay tranzaksyon an">
<button onclick="addTransaction()">Ajoute Tranzaksyon</button>
</div>

<div class="card">
<h2>Istwa Tranzaksyon</h2>
<table>
<thead><tr><th>Kalite</th><th>Montan</th><th>Kategori</th><th>Nòt</th><th>Dat</th><th></th></tr></thead>
<tbody id="txTable"></tbody>
</table>
</div>

</main>

<footer>© 2026 BSS1815 PRO-MAX DMP | Finance / Treasury</footer>

<script>
let transactions = JSON.parse(localStorage.getItem("bss1815_finance")) || [];

function save(){ localStorage.setItem("bss1815_finance", JSON.stringify(transactions)); }

function addTransaction(){
const type = document.getElementById("txType").value;
const amount = parseFloat(document.getElementById("txAmount").value);
const category = document.getElementById("txCategory").value.trim();
const notes = document.getElementById("txNotes").value.trim();

if(isNaN(amount) || amount <= 0){ alert("Montan valid obligatwa."); return; }

transactions.unshift({type,amount,category,notes,date:new Date().toLocaleString()});
save();

document.getElementById("txAmount").value="";
document.getElementById("txCategory").value="";
document.getElementById("txNotes").value="";

render();
}

function deleteTx(index){
transactions.splice(index,1);
save();
render();
}

function render(){
const tbody = document.getElementById("txTable");
tbody.innerHTML = "";

let income = 0, expense = 0;

transactions.forEach((t,index) => {
if(t.type === "income") income += t.amount; else expense += t.amount;

const row = document.createElement("tr");
const cls = t.type === "income" ? "positive" : "negative";
const label = t.type === "income" ? "Antre" : "Depans";
row.innerHTML = `<td class="${cls}">${label}</td><td class="${cls}">$${t.amount.toFixed(2)}</td><td>${t.category}</td><td>${t.notes}</td><td>${t.date}</td><td><button onclick="deleteTx(${index})">🗑</button></td>`;
tbody.appendChild(row);
});

document.getElementById("totalIncome").textContent = "$" + income.toFixed(2);
document.getElementById("totalExpense").textContent = "$" + expense.toFixed(2);
document.getElementById("balance").textContent = "$" + (income-expense).toFixed(2);
}

render();
</script>

</body>
</html>
