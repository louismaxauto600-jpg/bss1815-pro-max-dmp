<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Election Manager | BSS1815 PRO-MAX DMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#000,#ff6a00,#000);color:#fff;min-height:100vh}
header{text-align:center;padding:40px 20px;background:#000;border-bottom:3px solid #ff7a00}
header h1{font-size:45px;color:#ff7a00}
header p{color:#ffb366;margin-top:10px}
.back-btn{display:inline-block;margin-top:14px;color:#fff3e6;text-decoration:none;border:1px solid #ff7a00;padding:9px 14px;border-radius:30px;font-weight:bold}
.back-btn:hover{background:#ff7a00;color:#000}
main{width:min(1200px,95%);margin:30px auto}
.card{background:#111;border:2px solid #ff7a00;border-radius:15px;padding:20px;margin-bottom:25px}
.card h2{color:#ff7a00;margin-bottom:15px}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:bold;color:#ffb366}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ff7a00;background:#000;color:#fff}
button{margin-top:15px;padding:12px 20px;background:#ff7a00;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{background:#ff8c1a}
.candidate-row{display:flex;justify-content:space-between;align-items:center;background:#000;border:1px solid #ff7a00;border-radius:10px;padding:14px;margin-top:12px}
.bar-bg{background:#222;border-radius:6px;height:14px;margin-top:8px;overflow:hidden}
.bar-fill{background:#ff7a00;height:100%}
footer{text-align:center;padding:20px;margin-top:40px;border-top:3px solid #ff7a00;background:#000}
</style>
</head>
<body>

<header>
<h1>ELECTION MANAGER</h1>
<p>BSS1815 PRO-MAX DMP</p>
<p><strong>DEVAN DEVAN NÈT. PARE POU DEMEN.</strong></p>
<a class="back-btn" href="../../index.html">← Retounen nan Platfòm nan</a>
</header>

<main>

<div class="card">
<h2>Ajoute Kandida</h2>
<label>Non Kandida</label>
<input id="candName" type="text" placeholder="Non konplè kandida a">
<label>Pozisyon</label>
<input id="candPosition" type="text" placeholder="Egzanp: Prezidan, Sekretè...">
<button onclick="addCandidate()">Ajoute Kandida</button>
</div>

<div class="card">
<h2>Kandida yo & Vòt</h2>
<div id="candidatesList"></div>
</div>

<div class="card">
<h2>Rezilta</h2>
<div id="resultsList"></div>
</div>

</main>

<footer>© 2026 BSS1815 PRO-MAX DMP | Election Manage
