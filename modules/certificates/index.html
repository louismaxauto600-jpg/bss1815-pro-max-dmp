
<!-- FILE: modules/certificates/index.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Center | BSS1815 PRO-MAX DMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#000,#ff6a00,#000);color:#fff;min-height:100vh}
header{text-align:center;padding:40px 20px;background:#000;border-bottom:3px solid #ff7a00}
header h1{font-size:45px;color:#ff7a00}
header p{color:#ffb366;margin-top:10px}
.back-btn{display:inline-block;margin-top:14px;color:#fff3e6;text-decoration:none;border:1px solid #ff7a00;padding:9px 14px;border-radius:30px;font-weight:bold}
.back-btn:hover{background:#ff7a00;color:#000}
main{width:min(1200px,95%);margin:30px auto}
.layout{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.layout{grid-template-columns:1fr 1fr}}
.card{background:#111;border:2px solid #ff7a00;border-radius:15px;padding:20px;margin-bottom:25px}
.card h2{color:#ff7a00;margin-bottom:15px}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:bold;color:#ffb366}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ff7a00;background:#000;color:#fff}
button{margin-top:15px;padding:12px 20px;background:#ff7a00;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-right:8px}
button:hover{background:#ff8c1a}
.preview-wrap{display:flex;align-items:center;justify-content:center;background:#000;border:1px solid #ff7a00;border-radius:12px;padding:12px;overflow:auto}
#certCanvas{max-width:100%;border-radius:6px}
table{width:100%;border-collapse:collapse;margin-top:18px;background:#000;border-radius:12px;overflow:hidden}
th,td{border:1px solid #ff7a00;padding:10px;text-align:left}
th{background:#ff7a00;color:#000}
footer{text-align:center;padding:20px;margin-top:40px;border-top:3px solid #ff7a00;background:#000}
</style>
</head>
<body>

<header>
<h1>CERTIFICATE CENTER</h1>
<p>BSS1815 PRO-MAX DMP</p>
<p><strong>DEVAN DEVAN NÈT. PARE POU DEMEN.</strong></p>
<a class="back-btn" href="../../index.html">← Retounen nan Platfòm nan</a>
</header>

<main>

<div class="layout">

<div class="card">
<h2>Kreye Sètifika</h2>
<label>Non Benefisyè</label>
<input id="certName" type="text" placeholder="Non konplè" value="Non Benefisyè">
<label>Rezon / Pwogram</label>
<input id="certReason" type="text" placeholder="Egzanp: Konplete Fòmasyon AI" value="Konplete Fòmasyon">
<label>Dat</label>
<input id="certDate" type="text" placeholder="Egzanp: 13 Sektanm 2026" value="13 Sektanm 2026">
<label>Siyati (Otorite)</label>
<input id="certSignature" type="text" placeholder="Egzanp: Direktè BSS1815" value="Direktè BSS1815 PRO-MAX DMP">
<button onclick="drawCert()">🎨 Jenere</button>
<button onclick="issueCert()">🏆 Emèt & Sove</button>
<button onclick="downloadCert()">⬇ Telechaje PNG</button>
</div>

<div class="card">
<h2>Aperçu</h2>
<div class="preview-wrap">
<canvas id="certCanvas" width="1000" height="700"></canvas>
</div>
</div>

</div>

<div class="card">
<h2>Verifikasyon & Rejis Sètifika</h2>
<input id="verifyInput" type="text" placeholder="Tape ID sètifika pou verifye..." style="margin-bottom:14px" onkeyup="renderCerts()">
<table>
<thead><tr><th>ID</th><th>Benefisyè</th><th>Rezon</th><th>Dat</th><th></th></tr></thead>
<tbody id="certsTable"></tbody>
</table>
</div>

</main>

<footer>© 2026 BSS1815 PRO-MAX DMP | Certificate Center</footer>

<script>
const canvas = document.getElementById("certCanvas");
const ctx = canvas.getContext("2d");

function drawCert(){
const name = document.getElementById("certName").value || "Non Benefisyè";
const reason = document.getElementById("certReason").value || "";
const date = document.getElementById("certDate").value || "";
const signature = document.getElementById("certSignature").value || "";

const w = canvas.width, h = canvas.height;

ctx.fillStyle = "#0b0400";
ctx.fillRect(0,0,w,h);

ctx.strokeStyle = "#ff7900";
ctx.lineWidth = 12;
ctx.strokeRect(20,20,w-40,h-40);
ctx.lineWidth = 3;
ctx.strokeRect(40,40,w-80,h-80);

ctx.fillStyle = "#ff7900";
ctx.font = "bold 26px Arial";
ctx.textAlign = "center";
ctx.fillText("BSS1815 PRO-MAX DMP", w/2, 100);

ctx.font = "bold 52px Arial";
ctx.fillText("SÈTIFIKA", w/2, 190);

ctx.fillStyle = "#ffffff";
ctx.font = "22px Arial";
ctx.fillText("Sa a sètifye ke", w/2, 250);

ctx.fillStyle = "#ff7900";
ctx.font = "bold 44px Arial";
ctx.fillText(name, w/2, 320);

ctx.fillStyle = "#ffffff";
ctx.font = "24px Arial";
ctx.fillText(reason, w/2, 380);

ctx.font = "20px Arial";
ctx.fillStyle = "#ffd2a1";
ctx.fillText(date, w/2, 430);

ctx.textAlign = "left";
ctx.fillStyle = "#ffffff";
ctx.font = "18px Arial";
ctx.fillText("_________________________", 120, 600);
ctx.fillText(signature, 120, 630);

ctx.textAlign = "right";
ctx.fillText("ID: " + (window.currentCertId || "PENDING"), w-120, 630);
}

function issueCert(){
const name = document.getElementById("certName").value.trim();
const reason = document.getElementById("certReason").value.trim();
const date = document.getElementById("certDate").value.trim();

if(!name){ alert("Non benefisyè obligatwa."); return; }

const id = "CERT-" + Date.now().toString().slice(-8);
window.currentCertId = id;
drawCert();

let certs = JSON.parse(localStorage.getItem("bss1815_certificates")) || [];
certs.unshift({id,name,reason,date});
localStorage.setItem("bss1815_certificates", JSON.stringify(certs));

renderCerts();
}

function downloadCert(){
drawCert();
const link = document.createElement("a");
link.download = "sètifika-bss1815.png";
link.href = canvas.toDataURL("image/png");
link.click();
}

function deleteCert(index){
let certs = JSON.parse(localStorage.getItem("bss1815_certificates")) || [];
certs.splice(index,1);
localStorage.setItem("bss1815_certificates", JSON.stringify(certs));
renderCerts();
}

function renderCerts(){
const tbody = document.getElementById("certsTable");
const search = (document.getElementById("verifyInput").value || "").toLowerCase();
let certs = JSON.parse(localStorage.getItem("bss1815_certificates")) || [];
tbody.innerHTML = "";

const filtered = certs.filter(c => Object.values(c).join(" ").toLowerCase().includes(search));

filtered.forEach((c) => {
const realIndex = certs.indexOf(c);
const row = document.createElement("tr");
row.innerHTML = `<td>${c.id}</td><td>${c.name}</td><td>${c.reason}</td><td>${c.date}</td><td><button onclick="deleteCert(${realIndex})">🗑</button></td>`;
tbody.appendChild(row);
});
}

drawCert();
renderCerts();
</script>

</body>
</html>
