<!-- FILE: modules/live-streaming/index.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Streaming | BSS1815 PRO-MAX DMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#000,#ff6a00,#000);color:#fff;min-height:100vh}
header{text-align:center;padding:40px 20px;background:#000;border-bottom:3px solid #ff7a00}
header h1{font-size:45px;color:#ff7a00}
header p{color:#ffb366;margin-top:10px}
.back-btn{display:inline-block;margin-top:14px;color:#fff3e6;text-decoration:none;border:1px solid #ff7a00;padding:9px 14px;border-radius:30px;font-weight:bold}
.back-btn:hover{background:#ff7a00;color:#000}
main{width:min(1200px,95%);margin:30px auto}
.card{background:#111;border:2px solid #ff7a00;border-radius:15px;padding:20px;margin-bottom:25px}
.card h2{color:#ff7a00;margin-bottom:15px}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:bold;color:#ffb366}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ff7a00;background:#000;color:#fff}
button{margin-top:15px;padding:12px 20px;background:#ff7a00;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{background:#ff8c1a}
.player-wrap{position:relative;padding-top:56.25%;background:#000;border:1px solid #ff7a00;border-radius:12px;overflow:hidden}
.player-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.schedule-item{background:#000;border:1px solid #ff7a00;border-radius:10px;padding:14px;margin-top:12px}
footer{text-align:center;padding:20px;margin-top:40px;border-top:3px solid #ff7a00;background:#000}
</style>
</head>
<body>

<header>
<h1>LIVE STREAMING</h1>
<p>BSS1815 PRO-MAX DMP · PRO-MAX FM</p>
<p><strong>DEVAN DEVAN NÈT. PARE POU DEMEN.</strong></p>
<a class="back-btn" href="../../index.html">← Retounen nan Platfòm nan</a>
</header>

<main>

<div class="card">
<h2>Player Live</h2>
<div class="player-wrap" id="playerWrap">
<iframe id="liveFrame" src="about:blank" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>
<label>Lyen Live (YouTube embed, Facebook Live, elatriye)</label>
<input id="streamUrl" type="text" placeholder="Kole lyen embed live la isit">
<button onclick="loadStream()">▶ Chaje Live</button>
</div>

<div class="card">
<h2>Pwograme Pwochen Emisyon</h2>
<label>Tit Pwogram</label>
<input id="schedTitle" type="text" placeholder="Egzanp: PRO-MAX FM Morning Show">
<label>Dat & Lè</label>
<input id="schedDatetime" type="text" placeholder="Egzanp: Lendi 21 Sektanm, 8:00 AM">
<button onclick="addSchedule()">📅 Ajoute nan Orè</button>

<div id="scheduleList"></div>
</div>

</main>

<footer>© 2026 BSS1815 PRO-MAX DMP | Live Streaming</footer>

<script>
function loadStream(){
const url = document.getElementById("streamUrl").value.trim();
if(!url){ alert("Kole yon lyen embed."); return; }
document.getElementById("liveFrame").src = url;
localStorage.setItem("bss1815_stream_url", url);
}

let schedule = JSON.parse(localStorage.getItem("bss1815_stream_schedule")) || [];

function saveSchedule(){ localStorage.setItem("bss1815_stream_schedule", JSON.stringify(schedule)); }

function addSchedule(){
const title = document.getElementById("schedTitle").value.trim();
const datetime = document.getElementById("schedDatetime").value.trim();

if(!title || !datetime){ alert("Tit ak Dat/Lè obligatwa."); return; }

schedule.unshift({title,datetime});
saveSchedule();

document.getElementById("schedTitle").value="";
document.getElementById("schedDatetime").value="";

renderSchedule();
}

function removeSchedule(index){
schedule.splice(index,1);
saveSchedule();
renderSchedule();
}

function renderSchedule(){
const container = document.getElementById("scheduleList");
container.innerHTML = "";

schedule.forEach((s,index) => {
const div = document.createElement("div");
div.className = "schedule-item";
div.innerHTML = `<strong>${s.title}</strong><br><span style="color:#ffd2a1">${s.datetime}</span><br><button onclick="removeSchedule(${index})">🗑 Efase</button>`;
container.appendChild(div);
});
}

const savedUrl = localStorage.getItem("bss1815_stream_url");
if(savedUrl){
document.getElementById("streamUrl").value = savedUrl;
document.getElementById("liveFrame").src = savedUrl;
}

renderSchedule();
</script>

</body>
</html>
