<!-- FILE: modules/events/index.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Management | BSS1815 PRO-MAX DMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#000,#ff6a00,#000);color:#fff;min-height:100vh}
header{text-align:center;padding:40px 20px;background:#000;border-bottom:3px solid #ff7a00}
header h1{font-size:45px;color:#ff7a00}
header p{color:#ffb366;margin-top:10px}
.back-btn{display:inline-block;margin-top:14px;color:#fff3e6;text-decoration:none;border:1px solid #ff7a00;padding:9px 14px;border-radius:30px;font-weight:bold}
.back-btn:hover{background:#ff7a00;color:#000}
main{width:min(1200px,95%);margin:30px auto}
.card{background:#111;border:2px solid #ff7a00;border-radius:15px;padding:20px;margin-bottom:25px}
.card h2{color:#ff7a00;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:bold;color:#ffb366}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ff7a00;background:#000;color:#fff}
textarea{min-height:80px}
button{margin-top:15px;padding:12px 20px;background:#ff7a00;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{background:#ff8c1a}
.event-card{background:#000;border:1px solid #ff7a00;border-radius:12px;padding:16px;margin-top:14px}
.event-card h3{color:#ff7a00}
.event-meta{color:#ffd2a1;margin:6px 0}
footer{text-align:center;padding:20px;margin-top:40px;border-top:3px solid #ff7a00;background:#000}
</style>
</head>
<body>

<header>
<h1>EVENT MANAGEMENT</h1>
<p>BSS1815 PRO-MAX DMP</p>
<p><strong>DEVAN DEVAN NÈT. PARE POU DEMEN.</strong></p>
<a class="back-btn" href="../../index.html">← Retounen nan Platfòm nan</a>
</header>

<main>

<div class="card">
<h2>Kreye Evènman</h2>
<div class="grid">
<div>
<label>Tit Evènman</label>
<input id="evTitle" type="text" placeholder="Egzanp: Reyinyon Jeneral">
</div>
<div>
<label>Dat</label>
<input id="evDate" type="date">
</div>
<div>
<label>Lè</label>
<input id="evTime" type="time">
</div>
<div>
<label>Kote</label>
<input id="evLocation" type="text" placeholder="Kote evènman an ap fèt">
</div>
<div>
<label>Kategori</label>
<select id="evCategory">
<option>Reyinyon</option>
<option>Konsè</option>
<option>Aktivite Kominotè</option>
<option>Fòmasyon</option>
<option>Selebrasyon</option>
<option>Lòt</option>
</select>
</div>
</div>
<label>Deskripsyon</label>
<textarea id="evDescription" placeholder="Detay evènman an"></textarea>
<button onclick="addEvent()">Ajoute Evènman</button>
</div>

<div class="card">
<h2>Kalandriye Evènman</h2>
<div id="eventsList"></div>
</div>

</main>

<footer>© 2026 BSS1815 PRO-MAX DMP | Event Management</footer>

<script>
let events = JSON.parse(localStorage.getItem("bss1815_events")) || [];

function save(){ localStorage.setItem("bss1815_events", JSON.stringify(events)); }

function addEvent(){
const title = document.getElementById("evTitle").value.trim();
const date = document.getElementById("evDate").value;
const time = document.getElementById("evTime").value;
const location = document.getElementById("evLocation").value.trim();
const category = document.getElementById("evCategory").value;
const description = document.getElementById("evDescription").value.trim();

if(!title || !date){ alert("Tit ak Dat obligatwa."); return; }

events.push({title,date,time,location,category,description});
events.sort((a,b) => new Date(a.date+"T"+(a.time||"00:00")) - new Date(b.date+"T"+(b.time||"00:00")));
save();

document.getElementById("evTitle").value="";
document.getElementById("evLocation").value="";
document.getElementById("evDescription").value="";

render();
}

function deleteEvent(index){
events.splice(index,1);
save();
render();
}

function render(){
const container = document.getElementById("eventsList");
container.innerHTML = "";

events.forEach((e,index) => {
const div = document.createElement("div");
div.className = "event-card";
div.innerHTML = `
<h3>${e.title}</h3>
<div class="event-meta">📅 ${e.date} ${e.time ? "· ⏰ " + e.time : ""}</div>
<div class="event-meta">📍 ${e.location || "Pa presize"}</div>
<div class="event-meta">🏷 ${e.category}</div>
<p>${e.description || ""}</p>
<button onclick="deleteEvent(${index})">🗑 Efase</button>
`;
container.appendChild(div);
});

if(events.length === 0){
container.innerHTML = "<p style='color:#ffd2a1'>Pa gen evènman pou kounye a.</p>";
}
}

render();
</script>

</body>
</html>
