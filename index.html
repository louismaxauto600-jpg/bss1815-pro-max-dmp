<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BSS1815 PRO-MAX DMP</title>
<style>
:root{--orange:#ff7900;--text:#ffc589;--border:rgba(255,121,0,.28)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:var(--text);font-family:Arial}
.container{width:min(1220px,calc(100% - 24px));margin:auto}
.header-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between}
.brand-video-wrap{width:66px;height:66px;border:2px solid #ff7900;border-radius:14px;overflow:hidden}
.brand-video-wrap img{width:100%;height:100%;object-fit:cover}
.hero-logo-frame{width:420px;max-width:92vw;aspect-ratio:1/1;margin:28px auto 0;border:3px solid #ff7900;border-radius:22px;overflow:hidden}
.hero-logo-frame img{width:100%;height:100%;object-fit:cover}
.bss-stage{position:relative;width:100%;height:clamp(420px,60vw,660px);border:2px solid #ff7900;border-radius:24px;overflow:hidden;background:#000}
.bss-media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bss-media.hidden{display:none!important}
.modules-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.module-card{padding:18px;border:1px solid var(--border);border-radius:14px;background:#050200;color:var(--text);text-decoration:none}
</style>
</head>
<body>

</body>
</html>
