<!-- FILE: modules/documents/index.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Center | BSS1815 PRO-MAX DMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#000,#ff6a00,#000);color:#fff;min-height:100vh}
header{text-align:center;padding:40px 20px;background:#000;border-bottom:3px solid #ff7a00}
header h1{font-size:45px;color:#ff7a00}
header p{color:#ffb366;margin-top:10px}
.back-btn{display:inline-block;margin-top:14px;color:#fff3e6;text-decoration:none;border:1px solid #ff7a00;padding:9px 14px;border-radius:30px;font-weight:bold}
.back-btn:hover{background:#ff7a00;color:#000}
main{width:min(1200px,95%);margin:30px auto}
.card{background:#111;border:2px solid #ff7a00;border-radius:15px;padding:20px;margin-bottom:25px}
.card h2{color:#ff7a00;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:bold;color:#ffb366}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ff7a00;background:#000;color:#fff}
button{margin-top:15px;padding:12px 20px;background:#ff7a00;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{background:#ff8c1a}
table{width:100%;border-collapse:collapse;margin-top:18px;background:#000;border-radius:12px;overflow:hidden}
th,td{border:1px solid #ff7a00;padding:10px;text-align:left}
th{background:#ff7a00;color:#000}
footer{text-align:center;padding:20px;margin-top:40px;border-top:3px solid #ff7a00;background:#000}
</style>
</head>
<body>

<header>
<h1>DOCUMENT CENTER</h1>
<p>BSS1815 PRO-MAX DMP</p>
<p><strong>DEVAN DEVAN NÈT. PARE POU DEMEN.</strong></p>
<a class="back-btn" href="../../index.html">← Retounen nan Platfòm nan</a>
</header>

<main>

<div class="card">
<h2>Telechaje / Anrejistre Dokiman</h2>
<div class="grid">
<div>
<label>Tit Dokiman</label>
<input id="docTitle" type="text" placeholder="Egzanp: Lèt Ofisyèl Novanm 2026">
</div>
<div>
<label>Kategori</label>
<select id="docCategory">
<option>Lèt</option>
<option>Rapò</option>
<option>Achiv</option>
<option>Kontra</option>
<option>Lòt</option>
</select>
</div>
<div>
<label>Fichye (opsyonèl)</label>
<input id="docFile" type="file">
</div>
</div>
<label>Nòt</label>
<input id="docNotes" type="text" placeholder="Kèk detay sou dokiman an">
<button onclick="addDocument()">Anrejistre Dokiman</button>
</div>

<div class="card">
<h2>Achiv Dokiman</h2>
<table>
<thead><tr><th>Tit</th><th>Kategori</th><th>Dat</th><th>Nòt</th><th></th></tr></thead>
<tbody id="docsTable"></tbody>
</table>
</div>

</main>

<footer>© 2026 BSS1815 PRO-MAX DMP | Document Center</footer>

<script>
let docs = JSON.parse(localStorage.getItem("bss1815_documents")) || [];

function save(){ localStorage.setItem("bss1815_documents", JSON.stringify(docs)); }

function addDocument(){
const title = document.getElementById("docTitle").value.trim();
const category = document.getElementById("docCategory").value;
const notes = document.getElementById("docNotes").value.trim();
const fileInput = document.getElementById("docFile");
const file = fileInput.files[0];

function finish(fileData, fileName){
docs.unshift({
title,
category,
notes,
fileName: fileName || "",
fileData: fileData || "",
date: new Date().toLocaleString()
});
save();
document.getElementById("docTitle").value="";
document.getElementById("docNotes").value="";
fileInput.value="";
render();
}

if(!title){ alert("Tit obligatwa."); return; }

if(file && file.size < 2*1024*1024){
const reader = new FileReader();
reader.onload = function(e){ finish(e.target.result, file.name); };
reader.readAsDataURL(file);
}else{
finish("", file ? file.name : "");
}
}

function deleteDoc(index){
docs.splice(index,1);
save();
render();
}

function render(){
const tbody = document.getElementById("docsTable");
tbody.innerHTML = "";

docs.forEach((d,index) => {
const row = document.createElement("tr");
const link = d.fileData ? `<a href="${d.fileData}" download="${d.fileName}" style="color:#ff7a00">⬇ ${d.fileName}</a>` : (d.fileName || "—");
row.innerHTML = `<td>${d.title}</td><td>${d.category}</td><td>${d.date}</td><td>${d.notes}<br>${link}</td><td><button onclick="deleteDoc(${index})">🗑</button></td>`;
tbody.appendChild(row);
});
}

render();
</script>

</body>
</html>
