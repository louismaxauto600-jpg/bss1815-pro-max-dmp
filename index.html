<!-- FILE: modules/announcements/index.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcement Center | BSS1815 PRO-MAX DMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#000,#ff6a00,#000);color:#fff;min-height:100vh}
header{text-align:center;padding:40px 20px;background:#000;border-bottom:3px solid #ff7a00}
header h1{font-size:45px;color:#ff7a00}
header p{color:#ffb366;margin-top:10px}
.back-btn{display:inline-block;margin-top:14px;color:#fff3e6;text-decoration:none;border:1px solid #ff7a00;padding:9px 14px;border-radius:30px;font-weight:bold}
.back-btn:hover{background:#ff7a00;color:#000}
main{width:min(1200px,95%);margin:30px auto}
.card{background:#111;border:2px solid #ff7a00;border-radius:15px;padding:20px;margin-bottom:25px}
.card h2{color:#ff7a00;margin-bottom:15px}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:bold;color:#ffb366}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ff7a00;background:#000;color:#fff}
textarea{min-height:120px}
button{margin-top:15px;padding:12px 20px;background:#ff7a00;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{background:#ff8c1a}
.announce-card{background:#000;border:1px solid #ff7a00;border-radius:12px;padding:16px;margin-top:14px}
.badge{display:inline-block;background:#ff7a00;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:8px}
footer{text-align:center;padding:20px;margin-top:40px;border-top:3px solid #ff7a00;background:#000}
</style>
</head>
<body>

<header>
<h1>ANNOUNCEMENT CENTER</h1>
<p>BSS1815 PRO-MAX DMP</p>
<p><strong>DEVAN DEVAN NÈT. PARE POU DEMEN.</strong></p>
<a class="back-btn" href="../../index.html">← Retounen nan Platfòm nan</a>
</header>

<main>

<div class="card">
<h2>Pibliye Anons</h2>
<label>Kalite Anons</label>
<select id="anType">
<option>Anons Ofisyèl</option>
<option>Aktyalite Kominotè</option>
<option>Alèt</option>
<option>Rapèl</option>
</select>
<label>Tit</label>
<input id="anTitle" type="text" placeholder="Tit anons lan">
<label>Kontni</label>
<textarea id="anContent" placeholder="Ekri anons lan isit..."></textarea>
<button onclick="publish()">📣 Pibliye</button>
</div>

<div class="card">
<h2>Tout Anons</h2>
<div id="announcementsList"></div>
</div>

</main>

<footer>© 2026 BSS1815 PRO-MAX DMP | Announcement Center</footer>

<script>
let announcements = JSON.parse(localStorage.getItem("bss1815_announcements")) || [];

function save(){ localStorage.setItem("bss1815_announcements", JSON.stringify(announcements)); }

function publish(){
const type = document.getElementById("anType").value;
const title = document.getElementById("anTitle").value.trim();
const content = document.getElementById("anContent").value.trim();

if(!title || !content){ alert("Tit ak Kontni obligatwa."); return; }

announcements.unshift({type,title,content,date:new Date().toLocaleString()});
save();

document.getElementById("anTitle").value="";
document.getElementById("anContent").value="";

render();
}

function remove(index){
announcements.splice(index,1);
save();
render();
}

function render(){
const container = document.getElementById("announcementsList");
container.innerHTML = "";

announcements.forEach((a,index) => {
const div = document.createElement("div");
div.className = "announce-card";
div.innerHTML = `
<span class="badge">${a.type}</span>
<h3>${a.title}</h3>
<p style="margin:8px 0;color:#ffd2a1">${a.date}</p>
<p>${a.content}</p>
<button onclick="remove(${index})">🗑 Efase</button>
`;
container.appendChild(div);
});

if(announcements.length === 0){
container.innerHTML = "<p style='color:#ffd2a1'>Pa gen anons pou kounye a.</p>";
}
}

render();
</script>

</body>
</html>
