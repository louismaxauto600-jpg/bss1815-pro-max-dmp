<!-- FILE: member-id.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member ID | MY MAXIMAX</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="maximax.css">
</head>
<body>

<div id="app"><p class="boot">Ap chaje…</p></div>
<noscript><p class="boot">JavaScript dwe aktive pou paj sa a mache.</p></noscript>

<script type="module">
import { startModule } from "./maximax-core.js";

startModule({
  "title": "Member ID",
  "icon": "🪪",
  "desc": "Kat manm, idantifikasyon ak aksè.",
  "collection": "mx_member_ids",
  "fields": [
    {
      "key": "memberName",
      "label": "Non manm",
      "required": true
    },
    {
      "key": "idNumber",
      "label": "Nimewo kat"
    },
    {
      "key": "issuedAt",
      "label": "Dat emisyon",
      "type": "date"
    },
    {
      "key": "validUntil",
      "label": "Valab jiska",
      "type": "date"
    },
    {
      "key": "status",
      "label": "Estati",
      "type": "select",
      "options": [
        "Aktif",
        "Ekspire",
        "Revoke"
      ]
    },
    {
      "key": "notes",
      "label": "Nòt",
      "type": "textarea"
    }
  ],
  "badge": "status",
  "note": "Modil sa a anrejistre kat yo. Enprime kat la (foto, QR) poko konstwi."
});
</script>

</body>
</html>
