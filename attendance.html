<!-- FILE: attendance.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | MY MAXIMAX</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="maximax.css">
</head>
<body>

<div id="app"><p class="boot">Ap chaje…</p></div>
<noscript><p class="boot">JavaScript dwe aktive pou paj sa a mache.</p></noscript>

<script type="module">
import { startModule } from "./maximax-core.js";

startModule({
  "title": "Attendance",
  "icon": "📋",
  "desc": "Prezans manm nan reyinyon, aktivite ak evènman.",
  "collection": "mx_attendance",
  "fields": [
    {
      "key": "memberName",
      "label": "Non manm",
      "required": true
    },
    {
      "key": "eventName",
      "label": "Evènman / Reyinyon",
      "required": true
    },
    {
      "key": "date",
      "label": "Dat",
      "type": "date",
      "required": true
    },
    {
      "key": "presence",
      "label": "Prezans",
      "type": "select",
      "options": [
        "Prezan",
        "Absan",
        "Ekskize",
        "Reta"
      ]
    },
    {
      "key": "notes",
      "label": "Nòt",
      "type": "textarea"
    }
  ],
  "badge": "presence",
  "titleField": "memberName"
});
</script>

</body>
</html>
