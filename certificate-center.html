<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Center | MY MAXIMAX</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="maximax.css">
</head>
<body>

<div id="app"><p class="boot">Ap chaje…</p></div>
<noscript><p class="boot">JavaScript dwe aktive pou paj sa a mache.</p></noscript>

<script type="module">
import { startModule } from "./maximax-core.js";

startModule({
  "title": "Certificate Center",
  "icon": "🎓",
  "desc": "Kreye ak jere sètifika.",
  "collection": "mx_certificates",
  "fields": [
    {
      "key": "recipient",
      "label": "Non moun ki resevwa",
      "required": true
    },
    {
      "key": "certificateTitle",
      "label": "Tit sètifika",
      "required": true
    },
    {
      "key": "certNumber",
      "label": "Nimewo sètifika"
    },
    {
      "key": "issuedAt",
      "label": "Dat emisyon",
      "type": "date"
    },
    {
      "key": "issuer",
      "label": "Emèt"
    },
    {
      "key": "status",
      "label": "Estati",
      "type": "select",
      "options": [
        "Emèt",
        "Revoke"
      ]
    },
    {
      "key": "notes",
      "label": "Nòt",
      "type": "textarea"
    }
  ],
  "badge": "status",
  "titleField": "recipient",
  "note": "Modil sa a anrejistre sètifika yo. Jenerasyon PDF sètifika a poko konstwi."
});
</script>

</body>
</html>
