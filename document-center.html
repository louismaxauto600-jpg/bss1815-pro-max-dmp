<!-- FILE: document-center.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Center | MY MAXIMAX</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="maximax.css">
</head>
<body>

<div id="app"><p class="boot">Ap chaje…</p></div>
<noscript><p class="boot">JavaScript dwe aktive pou paj sa a mache.</p></noscript>

<script type="module">
import { startModule } from "./maximax-core.js";

startModule({
  "title": "Document Center",
  "icon": "📁",
  "desc": "Dokiman ofisyèl BSS1815 ak dosye administrasyon.",
  "collection": "mx_documents",
  "fields": [
    {
      "key": "title",
      "label": "Tit dokiman",
      "required": true
    },
    {
      "key": "category",
      "label": "Kategori"
    },
    {
      "key": "docDate",
      "label": "Dat dokiman",
      "type": "date"
    },
    {
      "key": "fileLink",
      "label": "Lyen fichye",
      "type": "url"
    },
    {
      "key": "status",
      "label": "Estati",
      "type": "select",
      "options": [
        "Bouyon",
        "Ofisyèl",
        "Achiv"
      ]
    },
    {
      "key": "description",
      "label": "Deskripsyon",
      "type": "textarea"
    }
  ],
  "badge": "status"
});
</script>

</body>
</html>
